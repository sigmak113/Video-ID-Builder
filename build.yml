name: Build Windows EXE

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설치
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 의존성 설치
        run: npm install

      - name: Windows exe 빌드
        run: npm run dist

      - name: 빌드 결과물 업로드 (Actions 탭에서 다운로드 가능)
        uses: actions/upload-artifact@v4
        with:
          name: VideoIDBuilder-windows
          path: dist/*.exe

      - name: 태그 푸시 시 GitHub Release 생성
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
